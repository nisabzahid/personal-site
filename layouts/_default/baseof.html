<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
    <meta name="theme-color" content="#f3f1ed" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    {{ with .OutputFormats.Get "rss" -}}
      <link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}" />
    {{- end }}
    <link rel="canonical" href="{{ .Permalink }}" />
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="container">
          <nav class="site-nav" aria-label="Main navigation">
            <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
            <div class="nav-links">
              {{ range site.Data.site.navigation }}
                <a href="{{ .url | relURL }}" {{ if eq $.RelPermalink .url }}class="active"{{ end }}>{{ .name }}</a>
              {{ end }}
            </div>
          </nav>
        </div>
      </header>

      <main>
        {{ block "main" . }}{{ end }}
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <p>© {{ now.Format "2006" }} {{ .Site.Title }}</p>
          <div class="footer-links">
            <a href="{{ .Site.Params.github }}" target="_blank" rel="noreferrer">GitHub</a>
            <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noreferrer">LinkedIn</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
